<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>EKOSFER: Duygu Aynası</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: #fff; }
  #container { position: relative; width: 100vw; height: 100vh; }
  video { display: none; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px 25px; border-radius: 12px; border: 2px solid #4ade80; pointer-events: none; z-index: 10; }
  h1 { margin: 0; font-size: 1.5rem; color: #4ade80; }
  p { margin: 5px 0 0 0; font-size: 0.9rem; color: #ccc; }
  #status { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 2.5rem; font-weight: bold; text-shadow: 0 0 20px #000, 0 0 10px #000; transition: 0.3s; z-index: 10; text-align: center; width: 100%; }
  #inst { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 8px; font-size: 0.8rem; color: #fbbf24; border: 1px solid #fbbf24; z-index: 10; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
<div id="container">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <h1>EKOSFER: Duygu Aynası</h1>
    <p>Gülümse, doğayı yeşert! | Üzülme, doğa kararır...</p>
  </div>
  <div id="inst">GİRESUN BULANCAK<br>BİLİM VE SANAT MERKEZİ</div>
  <div id="status">Kamera Bekleniyor...</div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusText = document.getElementById('status');

let isSmiling = false;
let faceLandmarks = null;
let particles = [];
let cameraStarted = false;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const faceMesh = new FaceMesh({locateFile: (file) => {
  return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
}});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(onResults);

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      cameraStarted = true;
      processVideo();
    };
  } catch (err) {
    statusText.innerText = "Kamera izni verilmedi!";
    statusText.style.color = "#ef4444";
  }
}

async function processVideo() {
  if (!cameraStarted) return;
  await faceMesh.send({image: video});
  requestAnimationFrame(processVideo);
}

setTimeout(initCamera, 1000);

function onResults(results) {
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    faceLandmarks = results.multiFaceLandmarks[0];
    
    const leftMouth = faceLandmarks[61];
    const rightMouth = faceLandmarks[291];
    const topLip = faceLandmarks[13];
    const bottomLip = faceLandmarks[14];

    const mouthWidth = Math.hypot(leftMouth.x - rightMouth.x, leftMouth.y - rightMouth.y);
    const mouthHeight = Math.hypot(topLip.x - bottomLip.x, topLip.y - bottomLip.y);
    
    const smileRatio = mouthWidth / mouthHeight;

    if (smileRatio > 3.5) {
      if (!isSmiling) {
        isSmiling = true;
        statusText.innerText = "🌿 DOĞA CANLANIYOR!";
        statusText.style.color = "#4ade80";
        for(let i=0; i<30; i++) createParticle(true);
        playSound('good');
      }
    } else {
      if (isSmiling) {
        isSmiling = false;
        statusText.innerText = "🌫️ KİRLİLİK ARTIYOR...";
        statusText.style.color = "#ef4444";
        for(let i=0; i<20; i++) createParticle(false);
        playSound('bad');
      }
    }
    drawAura();
  } else {
    statusText.innerText = "Yüz Algılanamadı...";
    statusText.style.color = "#fff";
    isSmiling = false;
  }

  drawParticles();
  ctx.restore();
}

function drawAura() {
  if (!faceLandmarks) return;
  const nose = faceLandmarks[1];
  const x = (1 - nose.x) * canvas.width;
  const y = nose.y * canvas.height;
  const radius = 150 + Math.sin(Date.now() * 0.005) * 20;

  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.strokeStyle = isSmiling ? 'rgba(74, 222, 128, 0.6)' : 'rgba(239, 68, 68, 0.6)';
  ctx.lineWidth = 8;
  ctx.stroke();
  ctx.shadowBlur = 20;
  ctx.shadowColor = isSmiling ? '#4ade80' : '#ef4444';
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function createParticle(isGreen) {
  const x = Math.random() * canvas.width;
  const y = canvas.height + 20;
  particles.push({
    x: x, y: y,
    vx: (Math.random() - 0.5) * 4,
    vy: -Math.random() * 5 - 2,
    size: Math.random() * 15 + 10,
    maxLife: 100 + Math.random() * 100,
    isGreen: isGreen,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.1
  });
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.02;
    p.rot += p.rotSpeed;
    p.maxLife--;

    if (p.maxLife <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = Math.min(1, p.maxLife / 100);

    if (p.isGreen) {
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#166534';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-p.size, 0); ctx.lineTo(p.size, 0);
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(75, 85, 99, 0.7)';
      ctx.beginPath();
      ctx.arc(0, 0, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  
  if (type === 'good') {
    [800, 1000, 1200, 1500].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, now + i*0.05);
      g.gain.linearRampToValueAtTime(0.05, now + i*0.05 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.01, now + i*0.05 + 0.15);
      o.start(now + i*0.05); o.stop(now + i*0.05 + 0.2);
    });
  } else {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sawtooth'; o.frequency.setValueAtTime(200, now);
    o.frequency.exponentialRampToValueAtTime(100, now + 0.3);
    g.gain.setValueAtTime(0.05, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    o.start(now); o.stop(now + 0.4);
  }
}
</script>
</body>
</html>
