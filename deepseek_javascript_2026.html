<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKOSFER</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: sans-serif; color: #fff; }
  #cam, #scene { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
  #cam { transform: scaleX(-1); opacity: 0.4; z-index: 1; }
  #scene { z-index: 2; }
  #hud {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    background: rgba(0,0,0,0.7); padding: 15px 20px;
    border-radius: 12px; border: 1px solid #4ade80;
  }
  h1 { font-size: 1.2rem; color: #4ade80; margin-bottom: 8px; }
  #status { color: #fbbf24; font-weight: bold; }
  #status.happy { color: #4ade80; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
</head>
<body>
<video id="video" autoplay playsinline muted style="display:none"></video>
<canvas id="cam"></canvas>
<canvas id="scene"></canvas>
<div id="hud">
  <h1>🌿 EKOSFER</h1>
  <span id="status">Yüz aranıyor...</span>
</div>

<script>
const video = document.getElementById('video');
const camCanvas = document.getElementById('cam');
const camCtx = camCanvas.getContext('2d');
const scene = document.getElementById('scene');
const ctx = scene.getContext('2d');
const statusEl = document.getElementById('status');

let time = 0;
let isHappy = false;
let faceCenter = { x: 0, y: 0 };
let landmarks = null;

function resize() {
  camCanvas.width = scene.width = innerWidth;
  camCanvas.height = scene.height = innerHeight;
}
addEventListener('resize', resize);
resize();

// SES
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playBird() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  for (let i = 0; i < 3; i++) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    const start = now + i * 0.1;
    o.frequency.setValueAtTime(2500 + Math.random() * 800, start);
    o.frequency.exponentialRampToValueAtTime(3000, start + 0.1);
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.03, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, start + 0.15);
    o.start(start); o.stop(start + 0.2);
  }
}

// MEDIAPIPE
const faceMesh = new FaceMesh({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
});
faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
faceMesh.onResults(onResults);

// KAMERA
async function start() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720 }
    });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      loop();
    };
  } catch (e) {
    statusEl.textContent = 'Kamera izni gerekli!';
    statusEl.style.color = '#ef4444';
  }
}
start();

let busy = false;
async function loop() {
  if (!busy) {
    busy = true;
    try { await faceMesh.send({ image: video }); } catch(e) {}
    busy = false;
  }
  requestAnimationFrame(loop);
}

function onResults(r) {
  time += 0.03;

  // Kamera arka plan
  camCtx.save();
  camCtx.translate(camCanvas.width, 0);
  camCtx.scale(-1, 1);
  camCtx.drawImage(video, 0, 0, camCanvas.width, camCanvas.height);
  camCtx.restore();

  ctx.clearRect(0, 0, scene.width, scene.height);

  if (r.multiFaceLandmarks && r.multiFaceLandmarks.length > 0) {
    landmarks = r.multiFaceLandmarks[0];
    const nose = landmarks[1];
    faceCenter.x = (1 - nose.x) * scene.width;
    faceCenter.y = nose.y * scene.height;

    // Gülümseme
    const mL = landmarks[61], mR = landmarks[291];
    const tL = landmarks[13], bL = landmarks[14];
    const mw = Math.hypot(mL.x - mR.x, mL.y - mR.y);
    const mh = Math.hypot(tL.x - bL.x, tL.y - bL.y) || 0.001;
    isHappy = (mw / mh) > 3.2;

    statusEl.textContent = isHappy ? '🌿 CANLANIYOR!' : 'GÜLÜMSE';
    statusEl.className = isHappy ? 'happy' : '';

    if (isHappy && Math.random() > 0.97) playBird();

    drawTree();
  } else {
    statusEl.textContent = 'Kameraya bak...';
    statusEl.className = '';
  }
}

function drawTree() {
  const W = scene.width, H = scene.height;
  const mx = p => (1 - p.x) * W;
  const my = p => p.y * H;
  const cx = faceCenter.x, cy = faceCenter.y;

  // Alın-çene mesafesi = ağaç boyu
  const fH = Math.hypot(mx(landmarks[10]) - mx(landmarks[152]), my(landmarks[10]) - my(landmarks[152]));
  const scale = isHappy ? 1.4 : 1.0;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  // GÖVDE
  const sway = Math.sin(time * 1.5) * 6;
  ctx.beginPath();
  ctx.moveTo(0, fH * 0.4);
  ctx.quadraticCurveTo(sway, 0, -sway, -fH * 0.7);
  ctx.strokeStyle = isHappy ? '#4ade80' : '#166534';
  ctx.lineWidth = isHappy ? 5 : 3;
  ctx.lineCap = 'round';
  if (isHappy) { ctx.shadowBlur = 20; ctx.shadowColor = '#4ade80'; }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // DALLAR (yüz hatlarından)
  const branches = [
    [33, 46], [263, 276],   // kaşlar
    [70, 63], [300, 293],   // elmacık
    [172, 136], [397, 365], // çene
  ];

  branches.forEach(([a, b], i) => {
    const ax = mx(landmarks[a]) - cx, ay = my(landmarks[a]) - cy;
    const bx = mx(landmarks[b]) - cx, by = my(landmarks[b]) - cy;
    const ex = ax + (bx - ax) * (isHappy ? 1.8 : 1.2);
    const ey = ay + (by - ay) * (isHappy ? 1.8 : 1.2);

    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo((ax + bx) / 2, (ay + by) / 2 - 15, ex, ey);
    ctx.strokeStyle = isHappy ? '#22c55e' : '#15803d';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Yaprak
    const ls = isHappy ? 14 : 8;
    ctx.beginPath();
    ctx.ellipse(ex, ey, ls, ls * 0.5, Math.atan2(ey - ay, ex - ax), 0, Math.PI * 2);
    ctx.fillStyle = isHappy
      ? `hsla(${120 + Math.sin(time + i) * 20}, 75%, 55%, 0.85)`
      : 'rgba(22, 101, 52, 0.6)';
    ctx.fill();
  });

  ctx.restore();

  // Göz ışıması
  if (isHappy) {
    [159, 386].forEach((idx, i) => {
      const ex = mx(landmarks[idx]), ey = my(landmarks[idx]);
      const r = 30 + Math.sin(time * 5 + i) * 10;
      const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, r);
      g.addColorStop(0, 'rgba(74,222,128,0.6)');
      g.addColorStop(1, 'rgba(74,222,128,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(ex, ey, r, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // Etrafta uçuşanlar
  const count = isHappy ? 25 : 8;
  for (let i = 0; i < count; i++) {
    const ang = time * 0.8 + i * Math.PI * 2 / count;
    const rad = 140 + Math.sin(time * 2 + i) * 40;
    const px = cx + Math.cos(ang) * rad;
    const py = cy + Math.sin(ang) * rad;
    ctx.beginPath();
    ctx.arc(px, py, 4, 0, Math.PI * 2);
    ctx.fillStyle = isHappy
      ? (i % 2 ? '#fbbf24' : '#4ade80')
      : 'rgba(100,100,100,0.5)';
    ctx.fill();
  }
}

// İlk tıklamada ses izni
document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
</html>
