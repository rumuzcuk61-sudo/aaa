<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>EKOSFER: Ekobilinç Ağacı</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: #fff; }
  #container { position: relative; width: 100vw; height: 100vh; }
  video { display: none; }
  
  /* Kamera görüntüsü arka planda, ayna efektiyle */
  canvas#webcamCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.4; z-index: 1; }
  
  /* Sanat ve animasyon katmanı */
  canvas#sceneCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  
  #hud { position: absolute; top: 30px; left: 30px; z-index: 10; background: rgba(10, 20, 10, 0.8); padding: 20px; border-radius: 15px; border: 1px solid rgba(74, 222, 128, 0.5); backdrop-filter: blur(10px); }
  h1 { margin: 0; font-size: 2rem; color: #4ade80; text-shadow: 0 0 10px #000; }
  p { margin: 5px 0 0 0; font-size: 1rem; color: #ccc; }
  #status { color: #fbbf24; font-weight: bold; margin-top: 10px; display: block; font-size: 1.3rem; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
<div id="container">
  <video id="video" autoplay playsinline></video>
  <canvas id="webcamCanvas"></canvas>
  <canvas id="sceneCanvas"></canvas>
  
  <div id="hud">
    <h1>EKOSFER: Ekobilinç Ağacı</h1>
    <p>Kameraya bak, yüzünün doğayla bütünleşmesini izle.</p>
    <span id="status">Yüz Aranıyor...</span>
  </div>
</div>

<script>
const video = document.getElementById('video');
const webcamCanvas = document.getElementById('webcamCanvas');
const webcamCtx = webcamCanvas.getContext('2d');
const sceneCanvas = document.getElementById('sceneCanvas');
const ctx = sceneCanvas.getContext('2d');
const statusText = document.getElementById('status');

let cameraStarted = false;
let time = 0;
let faceData = { x: 0, y: 0, smile: 0, detected: false, landmarks: null };

function resize() {
  webcamCanvas.width = window.innerWidth;
  webcamCanvas.height = window.innerHeight;
  sceneCanvas.width = window.innerWidth;
  sceneCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- SES MOTORU ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playBirdSound() {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  for(let i=0; i<3; i++) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    const start = now + i * 0.1;
    o.frequency.setValueAtTime(2500 + Math.random()*1000, start);
    o.frequency.exponentialRampToValueAtTime(3000 + Math.random()*1000, start + 0.05);
    o.frequency.exponentialRampToValueAtTime(2000, start + 0.1);
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.03, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, start + 0.15);
    o.start(start); o.stop(start + 0.2);
  }
}

// --- YAPAY ZEKA (MediaPipe) ---
const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
faceMesh.setOptions({maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
faceMesh.onResults(onResults);

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      cameraStarted = true;
      processVideo();
    };
  } catch (err) {
    statusText.innerText = "Kamera izni gerekli!";
    statusText.style.color = "#ef4444";
  }
}
async function processVideo() {
  if (!cameraStarted) return;
  await faceMesh.send({image: video});
  requestAnimationFrame(processVideo);
}
setTimeout(initCamera, 500);

function onResults(results) {
  time += 0.03;
  
  // Kamera arka planı
  if(cameraStarted) {
    webcamCtx.save();
    webcamCtx.translate(webcamCanvas.width, 0);
    webcamCtx.scale(-1, 1);
    webcamCtx.drawImage(video, 0, 0, webcamCanvas.width, webcamCanvas.height);
    webcamCtx.restore();
  }

  ctx.clearRect(0, 0, sceneCanvas.width, sceneCanvas.height);

  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const lm = results.multiFaceLandmarks[0];
    faceData.detected = true;
    faceData.landmarks = lm;
    
    // Yüzün merkezi (Burun)
    const nose = lm[1];
    faceData.x = (1 - nose.x) * sceneCanvas.width;
    faceData.y = nose.y * sceneCanvas.height;
    
    // Gülümseme oranı
    const leftMouth = lm[61], rightMouth = lm[291];
    const topLip = lm[13], bottomLip = lm[14];
    const w = Math.hypot(leftMouth.x - rightMouth.x, leftMouth.y - rightMouth.y);
    const h = Math.hypot(topLip.x - bottomLip.x, topLip.y - bottomLip.y);
    faceData.smile = w / h;
    
    const isHappy = faceData.smile > 3.5;
    statusText.innerText = isHappy ? "🌿 EKOBİLİNÇ CANLANIYOR!" : "DİJİTAL DOĞAYI BESLE";
    statusText.style.color = isHappy ? "#4ade80" : "#fbbf24";

    // SES: Gülümsediğinde kuş sesi
    if (isHappy && Math.random() > 0.9) {
      playBirdSound();
    }

    // --- "EKOBİLİNÇ AĞACI" ÇİZİMİ ---
    
    // Yüzün etrafına, yüz hatlarına uyumlu dallar ve yapraklar çiz
    
    ctx.save();
    // Yüz merkezini referans al
    ctx.translate(faceData.x, faceData.y);
    
    // Gülümseme arttıkça ağaç büyür ve parlar
    const treeScale = isHappy ? 1.5 : 1.0;
    ctx.scale(treeScale, treeScale);

    // 1. Dijital Gövde (Burun ve alın hattından yükselen)
    ctx.beginPath();
    ctx.moveTo(0, 80); // Çene altı
    ctx.quadraticCurveTo(20, 0, 0, -120); // Alına doğru
    ctx.quadraticCurveTo(-20, 0, 0, 80);
    ctx.strokeStyle = isHappy ? '#4ade80' : '#15803d';
    ctx.lineWidth = 4;
    ctx.shadowBlur = isHappy ? 20 : 0;
    ctx.shadowColor = '#4ade80';
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 2. Yüz Hatlarından Çıkan Dallar (Yüzün şekline göre)
    // Kaşlar (33, 263)
    const leftEyebrow = lm[33];
    const rightEyebrow = lm[263];
    
    ctx.beginPath();
    ctx.moveTo(0, -100);
    ctx.quadraticCurveTo((1-leftEyebrow.x)*sceneCanvas.width - faceData.x, (leftEyebrow.y)*sceneCanvas.height - faceData.y, -100, -150);
    ctx.quadraticCurveTo((1-rightEyebrow.x)*sceneCanvas.width - faceData.x, (rightEyebrow.y)*sceneCanvas.height - faceData.y, 100, -150);
    ctx.strokeStyle = isHappy ? '#22c55e' : '#166534';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 3. Gözlerden Çıkan Işıklar (Göz çevresi 159, 386)
    const leftEye = lm[159];
    const rightEye = lm[386];
    
    if (isHappy) {
      // Işıklar saç
      ctx.beginPath();
      ctx.arc((1-leftEye.x)*sceneCanvas.width - faceData.x, (leftEye.y)*sceneCanvas.height - faceData.y, 30 + Math.sin(time*5)*10, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(74, 222, 128, 0.4)';
      ctx.fill();
      
      ctx.beginPath();
      ctx.arc((1-rightEye.x)*sceneCanvas.width - faceData.x, (rightEye.y)*sceneCanvas.height - faceData.y, 30 + Math.cos(time*5)*10, 0, Math.PI*2);
      ctx.fill();
    }

    // 4. Yüzün Etrafında Uçuşan Kelebekler / Yapraklar
    const numParticles = isHappy ? 30 : 10;
    for(let i=0; i<numParticles; i++) {
      const angle = time + (i * Math.PI * 2 / numParticles);
      const rad = 150 + Math.sin(time*2 + i)*50;
      const px = Math.cos(angle) * rad;
      const py = Math.sin(angle) * rad;
      
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI*2);
      ctx.fillStyle = isHappy ? (i%2===0 ? '#fbbf24' : '#4ade80') : '#475569';
      ctx.fill();
    }
    
    ctx.restore();

  } else {
    faceData.detected = false;
    statusText.innerText = "Lütfen kameraya bakın...";
    statusText.style.color = "#fff";
  }
}
</script>
</body>
</html>
