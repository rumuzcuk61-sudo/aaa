<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKOSFER: Ekobilinç Ağacı</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #fff; }
  #cam, #scene { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
  #cam { transform: scaleX(-1); opacity: 0.3; z-index: 1; filter: saturate(0.6) contrast(1.2); }
  #scene { z-index: 2; pointer-events: none; }
  
  #hud {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    background: rgba(5, 15, 5, 0.8); padding: 18px 25px;
    border-radius: 15px; border: 1px solid rgba(74, 222, 128, 0.4);
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  h1 { font-size: 1.4rem; color: #4ade80; margin-bottom: 6px; letter-spacing: 1px; }
  #status { color: #fbbf24; font-weight: 600; font-size: 1rem; transition: all 0.3s; }
  #status.happy { color: #4ade80; text-shadow: 0 0 15px #4ade80; }
  
  #loader {
    position: fixed; inset: 0; z-index: 100; background: #061206;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; transition: opacity 0.8s;
  }
  .spinner {
    width: 50px; height: 50px; border-radius: 50%;
    border: 3px solid rgba(74, 222, 128, 0.1);
    border-top-color: #4ade80; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
</head>
<body>

<div id="loader">
  <h2 style="color:#4ade80; letter-spacing:4px;">EKOSFER</h2>
  <div class="spinner"></div>
  <p id="loaderText" style="color:#8bbf9a;">Yapay zeka modeli hazırlanıyor...</p>
</div>

<video id="video" autoplay playsinline muted style="display:none"></video>
<canvas id="cam"></canvas>
<canvas id="scene"></canvas>

<div id="hud">
  <h1>🌿 EKOSFER</h1>
  <span id="status">Kameraya bakın...</span>
</div>

<script>
const video = document.getElementById('video');
const camCanvas = document.getElementById('cam');
const camCtx = camCanvas.getContext('2d');
const scene = document.getElementById('scene');
const ctx = scene.getContext('2d');
const statusEl = document.getElementById('status');
const loader = document.getElementById('loader');
const loaderText = document.getElementById('loaderText');

let time = 0;
let isHappy = false;
let landmarks = null;
let faceScale = 1;

function resize() {
  camCanvas.width = scene.width = innerWidth;
  camCanvas.height = scene.height = innerHeight;
}
addEventListener('resize', resize);
resize();

// --- SES MOTORU ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playBird() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sine';
  o.frequency.setValueAtTime(2500 + Math.random() * 1000, now);
  o.frequency.exponentialRampToValueAtTime(3000 + Math.random() * 500, now + 0.1);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.04, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
  o.start(now); o.stop(now + 0.25);
}

// --- KAMERA VE YAPAY ZEKA ---
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 500);
      statusEl.textContent = 'Yüz aranıyor...';
      initFaceMesh();
    };
  } catch (e) {
    loaderText.textContent = "KAMERA HATASI: " + e.message;
    loaderText.style.color = "#ef4444";
  }
}

function initFaceMesh() {
  const faceMesh = new FaceMesh({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
  faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
  faceMesh.onResults(onResults);
  
  let busy = false;
  async function loop() {
    if (!busy) {
      busy = true;
      try { await faceMesh.send({ image: video }); } catch(e) {}
      busy = false;
    }
    requestAnimationFrame(loop);
  }
  loop();
}

// --- SONUÇLARI İŞLEME ---
function onResults(r) {
  time += 0.04;
  
  // Kamera arka planı
  camCtx.save();
  camCtx.translate(camCanvas.width, 0);
  camCtx.scale(-1, 1);
  camCtx.drawImage(video, 0, 0, camCanvas.width, camCanvas.height);
  camCtx.restore();

  ctx.clearRect(0, 0, scene.width, scene.height);

  if (r.multiFaceLandmarks && r.multiFaceLandmarks.length > 0) {
    landmarks = r.multiFaceLandmarks[0];
    
    // Gülümseme testi
    const leftMouth = landmarks[61], rightMouth = landmarks[291];
    const topLip = landmarks[13], bottomLip = landmarks[14];
    const w = Math.hypot(leftMouth.x - rightMouth.x, leftMouth.y - rightMouth.y);
    const h = Math.hypot(topLip.x - bottomLip.x, topLip.y - bottomLip.y) || 0.001;
    isHappy = (w / h) > 3.8; // Dişler göründüğünde gülümseme

    statusEl.textContent = isHappy ? '🌿 EKOBİLİNÇ CANLANIYOR!' : 'DİJİTAL DOĞAYI BESLE (GÜLÜMSE)';
    statusEl.className = isHappy ? 'happy' : '';

    if (isHappy && Math.random() > 0.95) playBird();

    // Yüz boyutu (Alın ile çene arası)
    const forehead = landmarks[10];
    const chin = landmarks[152];
    faceScale = Math.hypot((1-forehead.x)-(1-chin.x), forehead.y-chin.y) * scene.height;

    drawOrganicTree();
  } else {
    statusEl.textContent = 'Lütfen kameraya bakın...';
    statusEl.className = '';
  }
}

// --- SANAT: YÜZDEN BÜYÜYEN AĞAÇ ---
function drawOrganicTree() {
  const W = scene.width, H = scene.height;
  
  // Ayna koordinat düzeltmesi (Yapay zekanın sağı bizim solumuz)
  const toX = p => (1 - p.x) * W;
  const toY = p => p.y * H;

  const grow = isHappy ? 1.5 : 1.0;
  const glow = isHappy ? 20 : 0;
  const hue = 120 + Math.sin(time * 2) * 20;

  // 1. DAL VE YAPRAK ÇİZİM FONKSİYONU
  function drawBranch(startIdx, endIdx, dir) {
    const sx = toX(landmarks[startIdx]);
    const sy = toY(landmarks[startIdx]);
    const ex = toX(landmarks[endIdx]);
    const ey = toY(landmarks[endIdx]);
    
    // Dalın dışa doğru uzaması (Ayna düzeltmesiyle yönü ters çevir)
    const dx = (ex - sx) * dir; 
    const dy = (ey - sy) * dir;
    
    const len = Math.hypot(dx, dy) * grow;
    const angle = Math.atan2(dy, dx);
    
    // Yeni bitiş noktası
    const fx = sx + Math.cos(angle) * len;
    const fy = sy + Math.sin(angle) * len;

    // Dalı çiz
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(sx + dx * 0.5, sy + dy * 0.5 - 20, fx, fy);
    ctx.strokeStyle = isHappy ? '#4ade80' : '#166534';
    ctx.lineWidth = isHappy ? 3 : 2;
    ctx.lineCap = 'round';
    if (isHappy) { ctx.shadowBlur = glow; ctx.shadowColor = '#4ade80'; }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Yaprakları çiz
    ctx.beginPath();
    ctx.ellipse(fx, fy, isHappy ? 15 : 8, isHappy ? 7 : 4, angle, 0, Math.PI * 2);
    ctx.fillStyle = isHappy ? `hsla(${hue}, 80%, 60%, 0.9)` : 'rgba(21, 128, 61, 0.6)';
    ctx.fill();
  }

  // 2. DALLARI YÜZ HATLARINA UYGULA
  // 33: Sol kaş başı, 263: Sağ kaş başı, 70: Sol elmacık, 300: Sağ elmacık
  // 172: Sol çene, 397: Sağ çene, 105: Sol alın, 334: Sağ alın
  
  // Sol taraf (Ayna olduğu için ekranda sağda görünür, dir = -1)
  drawBranch(33, 46, -1);  // Sol kaş
  drawBranch(70, 63, -1);  // Sol elmacık
  drawBranch(172, 136, -1); // Sol çene
  
  // Sağ taraf (Ayna olduğu için ekranda solda görünür, dir = 1)
  drawBranch(263, 276, 1); // Sağ kaş
  drawBranch(300, 293, 1); // Sağ elmacık
  drawBranch(397, 365, 1); // Sağ çene
  
  // Alın bölgesi (Yukarı doğru)
  drawBranch(105, 66, -1); 
  drawBranch(334, 296, 1);

  // 3. GÖZLERDEN IŞIK SAÇILMASI
  if (isHappy) {
    [159, 386].forEach((idx) => {
      const ex = toX(landmarks[idx]), ey = toY(landmarks[idx]);
      const r = 45 + Math.sin(time * 5) * 15;
      const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, r);
      g.addColorStop(0, 'rgba(251, 191, 36, 0.5)'); // Altın sarısı
      g.addColorStop(0.5, 'rgba(74, 222, 128, 0.2)'); // Yeşil
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(ex, ey, r, 0, Math.PI * 2);
      ctx.fill();
    });
  }
}

document.body.addEventListener('click', initAudio, { once: true });
startCamera();
</script>
</body>
</html>
