<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>EKOSFER: Yüz Hareketiyle Ekosanat</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: #fff; }
  #container { position: relative; width: 100vw; height: 100vh; }
  video { display: none; }
  
  /* Kamera görüntüsü en arkada, hafif saydam */
  canvas#webcamCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.3; z-index: 1; filter: grayscale(50%) blur(2px); }
  
  /* Çizim ve Animasyon Katmanı */
  canvas#sceneCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  
  #hud { position: absolute; top: 30px; left: 30px; z-index: 10; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 15px; border: 1px solid rgba(74, 222, 128, 0.5); backdrop-filter: blur(5px); }
  h1 { margin: 0; font-size: 1.8rem; color: #4ade80; text-shadow: 0 0 10px #000; }
  p { margin: 5px 0 0 0; font-size: 1rem; color: #ccc; }
  #status { color: #fbbf24; font-weight: bold; margin-top: 10px; display: block; font-size: 1.2rem; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
<div id="container">
  <video id="video" autoplay playsinline></video>
  <canvas id="webcamCanvas"></canvas>
  <canvas id="sceneCanvas"></canvas>
  
  <div id="hud">
    <h1>EKOSFER</h1>
    <p>Kafanı çevir, dijital vadiyi yönet.</p>
    <span id="status">Yüz Aranıyor...</span>
  </div>
</div>

<script>
const video = document.getElementById('video');
const webcamCanvas = document.getElementById('webcamCanvas');
const webcamCtx = webcamCanvas.getContext('2d');
const sceneCanvas = document.getElementById('sceneCanvas');
const ctx = sceneCanvas.getContext('2d');
const statusText = document.getElementById('status');

let cameraStarted = false;
let time = 0;
let faceData = { x: 0, y: 0, smile: 0, detected: false };
let trees = [];
let particles = [];
let birds = [];

function resize() {
  webcamCanvas.width = window.innerWidth;
  webcamCanvas.height = window.innerHeight;
  sceneCanvas.width = window.innerWidth;
  sceneCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- SES MOTORU ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playChime() {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const notes = [523.25, 659.25, 783.99]; // Do, Mi, Sol
  notes.forEach((f, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, now + i*0.1);
    g.gain.linearRampToValueAtTime(0.05, now + i*0.1 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, now + i*0.1 + 0.8);
    o.start(now + i*0.1); o.stop(now + i*0.1 + 0.9);
  });
}

// --- OBJE ÜRETİCİLERİ ---
function initTrees() {
  trees = [];
  for(let i = 0; i < 9; i++) {
    trees.push({
      x: (i / 8) * sceneCanvas.width,
      baseY: sceneCanvas.height * 0.7 + Math.random() * 50,
      scale: 0.5 + Math.random() * 0.5,
      color: '#4ade80'
    });
  }
}
initTrees();

function spawnParticles(x, y, count) {
  for(let i=0; i<count; i++) {
    particles.push({
      x: x + (Math.random()-0.5)*100,
      y: y + (Math.random()-0.5)*100,
      vx: (Math.random()-0.5)*4,
      vy: -Math.random()*6 - 2,
      size: Math.random()*10 + 5,
      life: 1,
      color: Math.random() > 0.5 ? '#fbbf24' : '#ec4899'
    });
  }
}

// --- YAPAY ZEKA (MediaPipe) ---
const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
faceMesh.setOptions({maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
faceMesh.onResults(onResults);

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      cameraStarted = true;
      processVideo();
    };
  } catch (err) {
    statusText.innerText = "Kamera izni gerekli!";
    statusText.style.color = "#ef4444";
  }
}
async function processVideo() {
  if (!cameraStarted) return;
  await faceMesh.send({image: video});
  requestAnimationFrame(processVideo);
}
setTimeout(initCamera, 500);

function onResults(results) {
  time += 0.02;
  
  // Kamera arka planını çiz
  if(cameraStarted) {
    webcamCtx.save();
    webcamCtx.translate(webcamCanvas.width, 0);
    webcamCtx.scale(-1, 1);
    webcamCtx.drawImage(video, 0, 0, webcamCanvas.width, webcamCanvas.height);
    webcamCtx.restore();
  }

  ctx.clearRect(0, 0, sceneCanvas.width, sceneCanvas.height);

  // Yüz bulunduysa verileri al
  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const lm = results.multiFaceLandmarks[0];
    faceData.detected = true;
    
    // Yüzün ekrandaki X ve Y konumu (Burun ucu referans)
    const nose = lm[1];
    faceData.x = (1 - nose.x) * sceneCanvas.width;
    faceData.y = nose.y * sceneCanvas.height;
    
    // Gülümseme oranı
    const leftMouth = lm[61], rightMouth = lm[291];
    const topLip = lm[13], bottomLip = lm[14];
    const w = Math.hypot(leftMouth.x - rightMouth.x, leftMouth.y - rightMouth.y);
    const h = Math.hypot(topLip.x - bottomLip.x, topLip.y - bottomLip.y);
    faceData.smile = w / h;
    
    statusText.innerText = faceData.smile > 3.5 ? "🌿 GÜLÜMSÜYORSUN: DOĞA COŞUYOR!" : "DİJİTAL VADİYİ YÖNET";
    statusText.style.color = faceData.smile > 3.5 ? "#4ade80" : "#fbbf24";

    // --- GÖRSEL EFEKTLER ---
    
    // 1. Gökyüzü Rengi (Gülümsemeye göre)
    const skyLight = 50 + (faceData.smile > 3.5 ? 20 : 0);
    const skyGrad = ctx.createLinearGradient(0, 0, 0, sceneCanvas.height);
    skyGrad.addColorStop(0, `hsl(200, 80%, ${skyLight}%)`);
    skyGrad.addColorStop(1, `hsl(190, 70%, ${skyLight+20}%)`);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, sceneCanvas.width, sceneCanvas.height);

    // 2. Güneş
    ctx.beginPath();
    ctx.arc(sceneCanvas.width * 0.8, sceneCanvas.height * 0.2, 60, 0, Math.PI*2);
    ctx.fillStyle = faceData.smile > 3.5 ? '#ffeb3b' : '#ffd54f';
    ctx.shadowBlur = faceData.smile > 3.5 ? 80 : 20;
    ctx.shadowColor = '#fbbf24';
    ctx.fill();
    ctx.shadowBlur = 0;

    // 3. Ağaçlar (Yüzün X konumuna göre sallanır)
    trees.forEach((t, i) => {
      // Rüzgar etkisi yüzün hareketine bağlı
      const wind = (faceData.x - sceneCanvas.width/2) * 0.001;
      const sway = Math.sin(time*2 + i) * 10 + wind * 50;
      
      // Gövde
      ctx.fillStyle = '#451a03';
      ctx.fillRect(t.x - 10*t.scale + sway, t.baseY - 80*t.scale, 20*t.scale, 80*t.scale);
      
      // Yapraklar (Gülümsemeye göre parlar)
      ctx.beginPath();
      ctx.arc(t.x + sway, t.baseY - 110*t.scale, 45*t.scale, 0, Math.PI*2);
      ctx.fillStyle = faceData.smile > 3.5 ? '#22c55e' : '#4ade80';
      ctx.shadowBlur = faceData.smile > 3.5 ? 20 : 0;
      ctx.shadowColor = '#4ade80';
      ctx.fill();
      ctx.shadowBlur = 0;
      
      ctx.beginPath();
      ctx.arc(t.x - 25*t.scale + sway, t.baseY - 80*t.scale, 30*t.scale, 0, Math.PI*2);
      ctx.fill();
      
      ctx.beginPath();
      ctx.arc(t.x + 25*t.scale + sway, t.baseY - 80*t.scale, 30*t.scale, 0, Math.PI*2);
      ctx.fill();
    });

    // 4. Zemin
    ctx.fillStyle = '#166534';
    ctx.fillRect(0, sceneCanvas.height * 0.75, sceneCanvas.width, sceneCanvas.height * 0.25);

    // 5. Yüzün Etrafında Uçuşan Kuşlar ve Yapraklar
    if (faceData.smile > 3.5) {
      if (Math.random() > 0.8) spawnParticles(faceData.x, faceData.y, 2);
      
      // Kuşlar yüzün etrafında döner
      for(let i=0; i<3; i++) {
        const angle = time * 2 + (i * Math.PI * 2 / 3);
        const radius = 150;
        const bx = faceData.x + Math.cos(angle) * radius;
        const by = faceData.y + Math.sin(angle) * radius;
        
        ctx.beginPath();
        ctx.moveTo(bx - 10, by);
        ctx.quadraticCurveTo(bx, by - 10, bx + 10, by);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    // 6. Yüz Aurası (Gülümseme arttıkça büyür)
    ctx.beginPath();
    ctx.arc(faceData.x, faceData.y, 100 + (faceData.smile > 3.5 ? 40 : 0), 0, Math.PI * 2);
    ctx.strokeStyle = faceData.smile > 3.5 ? 'rgba(74, 222, 128, 0.8)' : 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 5;
    ctx.stroke();

  } else {
    faceData.detected = false;
    statusText.innerText = "Yüzünü kameraya göster...";
    statusText.style.color = "#fff";
    
    // Yüz yoksa karanlık bir ekran
    ctx.fillStyle = '#0a0f0a';
    ctx.fillRect(0, 0, sceneCanvas.width, sceneCanvas.height);
  }

  // 7. Partiküller
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
    if(p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(() => {}); // Mediapipe kendi döngüsünü yönetir
}
</script>
</body>
</html>
