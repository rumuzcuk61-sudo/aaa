<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>EKOSFER: Görsel Test</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; }
  
  /* Arka plan resmi (Doğa) */
  #world { position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=2000&auto=format&fit=crop') center/cover; filter: grayscale(100%) brightness(0.3); transition: all 1.5s ease; z-index: 1; }
  
  /* Arayüz */
  #ui { position: relative; z-index: 10; text-align: center; }
  h1 { font-size: 3rem; color: #4ade80; text-shadow: 0 0 20px #000; margin-bottom: 10px; }
  p { font-size: 1.2rem; color: #fff; text-shadow: 0 0 10px #000; margin-bottom: 40px; }
  
  /* Butonlar */
  .btn-group { display: flex; gap: 20px; justify-content: center; }
  button { padding: 15px 40px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
  .btn-happy { background: #4ade80; color: #000; }
  .btn-happy:hover { transform: scale(1.1); box-shadow: 0 0 30px #4ade80; }
  .btn-sad { background: #ef4444; color: #fff; }
  .btn-sad:hover { transform: scale(1.1); box-shadow: 0 0 30px #ef4444; }
  
  /* Yazı */
  #status { position: absolute; bottom: 50px; left: 0; width: 100%; text-align: center; font-size: 2rem; font-weight: bold; text-shadow: 0 0 20px #000; z-index: 10; transition: 0.3s; }
</style>
</head>
<body>

<!-- Arka plan -->
<div id="world"></div>

<!-- Arayüz -->
<div id="ui">
  <h1>EKOSFER</h1>
  <p>Doğanın halini değiştirmek için bir butona tıkla!</p>
  <div class="btn-group">
    <button class="btn-happy" onclick="changeWorld(true)">🌿 DOĞAYI YEŞERT</button>
    <button class="btn-sad" onclick="changeWorld(false)">🌫️ DOĞAYI KİRLET</button>
  </div>
</div>

<div id="status" style="color:#fff;">Bekleniyor...</div>

<script>
const world = document.getElementById('world');
const statusText = document.getElementById('status');
let isHappy = false;

// Ses Efektleri
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  if (type === 'good') {
    [800, 1000, 1200, 1500].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, now + i*0.05);
      g.gain.linearRampToValueAtTime(0.05, now + i*0.05 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.01, now + i*0.05 + 0.15);
      o.start(now + i*0.05); o.stop(now + i*0.05 + 0.2);
    });
  } else {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sawtooth'; o.frequency.setValueAtTime(200, now);
    o.frequency.exponentialRampToValueAtTime(100, now + 0.3);
    g.gain.setValueAtTime(0.05, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    o.start(now); o.stop(now + 0.4);
  }
}

function changeWorld(happy) {
  isHappy = happy;
  if (happy) {
    // Doğayı canlandır (Görsel filtresini kaldır)
    world.style.filter = 'grayscale(0%) brightness(1.1)';
    statusText.innerText = "🌿 DOĞA CANLANIYOR!";
    statusText.style.color = "#4ade80";
    playSound('good');
  } else {
    // Doğayı kirlet (Siyah beyaz ve karanlık yap)
    world.style.filter = 'grayscale(100%) brightness(0.3)';
    statusText.innerText = "🌫️ KİRLİLİK ARTIYOR...";
    statusText.style.color = "#ef4444";
    playSound('bad');
  }
}
</script>
</body>
</html>
